---
layout: single
title: "Talks & Presentations"
permalink: /talks/
author_profile: true
---

<style>
.globe-container {
  position: relative;
  width: 100%;
  margin-top: -1rem;
}
.globe-mount {
  width: 100%;
  height: 820px;
}
.globe-panel {
  position: absolute;
  top: 1rem;
  right: 1rem;
  width: 260px;
  background: var(--global-bg-color);
  border: 1px solid var(--global-border-color);
  border-radius: 6px;
  padding: 1rem 1rem 0.75rem;
  box-shadow: 0 4px 20px rgba(0,0,0,0.12);
  z-index: 10;
}
.globe-panel h3 {
  margin: 0 1.5rem 0.5rem 0;
  font-size: 0.95rem;
}
.globe-close {
  position: absolute;
  top: 0.6rem;
  right: 0.7rem;
  background: none;
  border: none;
  font-size: 1.2rem;
  cursor: pointer;
  color: var(--global-text-color);
  line-height: 1;
  padding: 0;
}
.globe-item {
  margin-top: 0.6rem;
  padding-top: 0.6rem;
  border-top: 1px solid var(--global-border-color);
}
.globe-item:first-of-type {
  margin-top: 0.25rem;
  padding-top: 0;
  border-top: none;
}
.globe-venue {
  font-weight: 600;
  font-size: 0.82rem;
}
.globe-year {
  font-size: 0.76rem;
  color: var(--global-text-color-light, #888);
  margin: 0.1rem 0 0.2rem;
}
.globe-paper {
  font-size: 0.78rem;
  font-style: italic;
  margin-top: 0.15rem;
}
.globe-hint {
  font-size: 0.85rem;
  color: var(--global-text-color-light, #888);
  margin-bottom: 0.25rem;
}
.globe-tag {
  display: inline-block;
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  padding: 0.1em 0.45em;
  border-radius: 3px;
  margin-bottom: 0.3rem;
  background: var(--global-border-color);
  color: var(--global-text-color-light, #666);
}
.globe-section-label {
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--global-text-color-light, #aaa);
  margin-top: 0.45rem;
  margin-bottom: 0.1rem;
}
.globe-pres-title {
  font-size: 0.80rem;
  font-style: italic;
}
</style>

<script>
  window.PRESENTATIONS = {{ site.data.presentations | jsonify }};
</script>

<p class="globe-hint">Click a dot to see presentations at that location.</p>
<div class="globe-container">
  <div id="globe-mount" class="globe-mount"></div>
  <div id="globe-panel" class="globe-panel" style="display:none;"></div>
</div>

<script src="https://unpkg.com/globe.gl@2/dist/globe.gl.min.js"></script>

<script>
(function () {
  var el    = document.getElementById('globe-mount');
  var panel = document.getElementById('globe-panel');

  var OCEAN  = "#e8e8e8";
  var LAND   = "#333333";
  var ATMOS  = "rgba(180,180,180,0.3)";
  var DOTS   = "#222222";
  var ACTIVE = "#555555";

  /* Group presentations by city (skip online/no-coord entries) */
  var seen   = [];
  var cityMap = {};
  (window.PRESENTATIONS || [])
    .filter(function (p) { return p.lat != null && p.lng != null; })
    .forEach(function (p) {
      if (!cityMap[p.city]) {
        cityMap[p.city] = { city: p.city, country: p.country, lat: p.lat, lng: p.lng, items: [] };
        seen.push(p.city);
      }
      cityMap[p.city].items.push(p);
    });
  var cities = seen.map(function (k) { return cityMap[k]; });

  /* Arcs between every pair of cities */
  var arcs = [];
  for (var i = 0; i < cities.length; i++) {
    for (var j = i + 1; j < cities.length; j++) {
      arcs.push({ startLat: cities[i].lat, startLng: cities[i].lng,
                  endLat:   cities[j].lat, endLng:   cities[j].lng });
    }
  }

  var activeCity = null;
  var world      = null;

  function closePanel() {
    activeCity = null;
    panel.style.display = 'none';
    if (world) {
      world.pointColor(function () { return DOTS; });
      world.controls().autoRotate = true;
    }
  }

  function showPanel(city) {
    if (!city) { closePanel(); return; }
    var html = '<button class="globe-close" id="globe-close-btn">&times;</button>';
    html += '<h3>' + city.city + (city.country ? ', ' + city.country : '') + '</h3>';
    city.items.forEach(function (item) {
      html += '<div class="globe-item">';
      if (item.type) html += '<span class="globe-tag">' + item.type + '</span>';
      html += '<div class="globe-venue">' + item.venue + '</div>';
      html += '<div class="globe-year">'  + item.year  + '</div>';
      if (item.title) {
        html += '<div class="globe-section-label">Presentation Title</div>';
        html += '<div class="globe-pres-title">' + item.title + '</div>';
      }
      if (item.papers && item.papers.length) {
        html += '<div class="globe-section-label">Paper / Project</div>';
        (item.papers || []).forEach(function (p) {
          html += '<div class="globe-paper">' + p + '</div>';
        });
      }
      html += '</div>';
    });
    panel.innerHTML = html;
    panel.style.display = 'block';
    document.getElementById('globe-close-btn').onclick = closePanel;
  }

  function initGlobe() {
    world = Globe()(el)
      .backgroundColor("rgba(0,0,0,0)")
      .showAtmosphere(true)
      .atmosphereColor(ATMOS)
      .atmosphereAltitude(0.14)
      .pointsData(cities)
      .pointLat(function (d) { return d.lat; })
      .pointLng(function (d) { return d.lng; })
      .pointColor(function () { return DOTS; })
      .pointAltitude(0.02)
      .pointRadius(1.8)
      .pointLabel(function (d) {
        return '<span style="font:12px sans-serif;padding:4px 8px;background:#fff;color:#111;' +
               'border:1px solid #ccc;border-radius:3px;white-space:nowrap;">' +
               d.city + ' · ' + d.items.length + ' event' + (d.items.length > 1 ? 's' : '') + '</span>';
      })
      .onPointClick(function (p) {
        if (activeCity === p.city) {
          closePanel();
        } else {
          activeCity = p.city;
          showPanel(p);
          world.pointColor(function (d) { return d.city === activeCity ? ACTIVE : DOTS; });
          world.controls().autoRotate = false;
          world.pointOfView({ lat: p.lat, lng: p.lng, altitude: 2.0 }, 800);
        }
      })
      .onPointHover(function (p) { el.style.cursor = p ? 'pointer' : 'grab'; })
      .arcsData(arcs)
      .arcStartLat(function (d) { return d.startLat; })
      .arcStartLng(function (d) { return d.startLng; })
      .arcEndLat(function (d) { return d.endLat; })
      .arcEndLng(function (d) { return d.endLng; })
      .arcColor(function () { return ['rgba(50,50,50,0)', 'rgba(50,50,50,0.6)', 'rgba(50,50,50,0)']; })
      .arcStroke(0.4)
      .arcDashLength(0.4)
      .arcDashGap(0.2)
      .arcDashAnimateTime(3000)
      .arcAltitudeAutoScale(0.4);

    try { world.globeMaterial().color.set(OCEAN); } catch (e) {}

    var controls       = world.controls();
    controls.autoRotate      = true;
    controls.autoRotateSpeed = 0.4;
    controls.enableZoom      = true;
    world.pointOfView({ lat: 46, lng: 14, altitude: 2.6 }, 0);

    fetch("https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson")
      .then(function (r) { return r.json(); })
      .then(function (data) {
        world
          .hexPolygonsData(data.features)
          .hexPolygonResolution(3)
          .hexPolygonMargin(0.4)
          .hexPolygonUseDots(true)
          .hexPolygonColor(function () { return LAND; });
      })
      .catch(function () {});

    var resize = function () { world.width(el.clientWidth).height(el.clientHeight); };
    resize();
    new ResizeObserver(resize).observe(el);
  }

  /* Globe is loaded synchronously above; poll only as a safety net */
  if (typeof Globe !== 'undefined') {
    initGlobe();
  } else {
    var iv = setInterval(function () {
      if (typeof Globe !== 'undefined') { clearInterval(iv); initGlobe(); }
    }, 150);
    setTimeout(function () { clearInterval(iv); }, 15000);
  }
}());
</script>
