---
layout: single
title: "Talks & Presentations"
permalink: /talks/
author_profile: true
---

<style>
.globe-container {
  position: relative;
  width: 100%;
  margin-top: -1rem;
}
.globe-mount {
  width: 100%;
  height: 820px;
}
.globe-panel {
  position: absolute;
  top: 1rem;
  right: 1rem;
  width: 260px;
  background: var(--global-bg-color);
  border: 1px solid var(--global-border-color);
  border-radius: 6px;
  padding: 1rem 1rem 0.75rem;
  box-shadow: 0 4px 20px rgba(0,0,0,0.12);
  z-index: 10;
}
.globe-panel h3 {
  margin: 0 1.5rem 0.5rem 0;
  font-size: 0.95rem;
}
.globe-close {
  position: absolute;
  top: 0.6rem;
  right: 0.7rem;
  background: none;
  border: none;
  font-size: 1.2rem;
  cursor: pointer;
  color: var(--global-text-color);
  line-height: 1;
  padding: 0;
}
.globe-item {
  margin-top: 0.6rem;
  padding-top: 0.6rem;
  border-top: 1px solid var(--global-border-color);
}
.globe-item:first-of-type {
  margin-top: 0.25rem;
  padding-top: 0;
  border-top: none;
}
.globe-venue {
  font-weight: 600;
  font-size: 0.82rem;
}
.globe-year {
  font-size: 0.76rem;
  color: var(--global-text-color-light, #888);
  margin: 0.1rem 0 0.2rem;
}
.globe-paper {
  font-size: 0.78rem;
  font-style: italic;
  margin-top: 0.15rem;
}
.globe-hint {
  font-size: 0.85rem;
  color: var(--global-text-color-light, #888);
  margin-bottom: 0.25rem;
}
.globe-tag {
  display: inline-block;
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  padding: 0.1em 0.45em;
  border-radius: 3px;
  margin-bottom: 0.3rem;
  background: var(--global-border-color);
  color: var(--global-text-color-light, #666);
}
</style>

<p class="globe-hint">Click a dot to see presentations at that location.</p>
<div id="globe-root"></div>

<script>
  window.PRESENTATIONS = {{ site.data.presentations | jsonify }};
</script>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/globe.gl@2/dist/globe.gl.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

// --- Color scheme (swap values to switch theme) ---
// Earth:  ocean "#1a6da8", land "#4a9e5c", atmosphere "#90caf9", dots "#ff6b35"
// Blue:   ocean "#0d2b5e", land "#1e6091", atmosphere "#64b5f6", dots "#ffd54f"
const OCEAN  = "#e8e8e8";
const LAND   = "#333333";
const ATMOS  = "rgba(180,180,180,0.3)";
const DOTS   = "#222222";
const ACTIVE = "#555555";

function GlobeSection() {
  const mountRef = useRef(null);
  const worldRef = useRef(null);
  const [active, setActive] = useState(null);
  const [ready, setReady]   = useState(false);
  const [globeReady, setGlobeReady] = useState(!!window.Globe);

  useEffect(() => {
    if (window.Globe) { setGlobeReady(true); return; }
    const iv = setInterval(() => { if (window.Globe) { setGlobeReady(true); clearInterval(iv); } }, 150);
    const to = setTimeout(() => clearInterval(iv), 15000);
    return () => { clearInterval(iv); clearTimeout(to); };
  }, []);

  // Group presentations by city, skip online entries with no coords
  const cities = useMemo(() => {
    const m = new Map();
    (window.PRESENTATIONS || [])
      .filter(p => p.lat != null && p.lng != null)
      .forEach(p => {
        if (!m.has(p.city)) {
          m.set(p.city, { city: p.city, country: p.country, lat: p.lat, lng: p.lng, items: [] });
        }
        m.get(p.city).items.push(p);
      });
    return Array.from(m.values());
  }, []);

  useEffect(() => {
    if (!mountRef.current || !globeReady) return;
    const el = mountRef.current;

    // Build arcs between every pair of cities
    const arcs = [];
    for (let i = 0; i < cities.length; i++) {
      for (let j = i + 1; j < cities.length; j++) {
        arcs.push({ startLat: cities[i].lat, startLng: cities[i].lng,
                    endLat:   cities[j].lat, endLng:   cities[j].lng });
      }
    }

    const world = window.Globe()(el)
      .backgroundColor("rgba(0,0,0,0)")
      .showAtmosphere(true)
      .atmosphereColor(ATMOS)
      .atmosphereAltitude(0.14)
      .pointsData(cities)
      .pointLat(d => d.lat)
      .pointLng(d => d.lng)
      .pointColor(() => DOTS)
      .pointAltitude(0.02)
      .pointRadius(1.8)
      .pointLabel(d =>
        `<span style="font:12px sans-serif;padding:4px 8px;background:#fff;color:#111;` +
        `border:1px solid #ccc;border-radius:3px;white-space:nowrap;">` +
        `${d.city} · ${d.items.length} event${d.items.length > 1 ? "s" : ""}</span>`
      )
      .onPointClick(p => setActive(prev => prev === p.city ? null : p.city))
      .onPointHover(p => { el.style.cursor = p ? "pointer" : "grab"; })
      .arcsData(arcs)
      .arcStartLat(d => d.startLat)
      .arcStartLng(d => d.startLng)
      .arcEndLat(d => d.endLat)
      .arcEndLng(d => d.endLng)
      .arcColor(() => [`rgba(50,50,50,0)`, `rgba(50,50,50,0.6)`, `rgba(50,50,50,0)`])
      .arcStroke(0.4)
      .arcDashLength(0.4)
      .arcDashGap(0.2)
      .arcDashAnimateTime(3000)
      .arcAltitudeAutoScale(0.4);

    // Ocean color on the globe surface
    try { world.globeMaterial().color.set(OCEAN); } catch(e) {}

    const controls = world.controls();
    controls.autoRotate      = true;
    controls.autoRotateSpeed = 0.4;
    controls.enableZoom      = true;
    world.pointOfView({ lat: 46, lng: 14, altitude: 2.6 }, 0);

    // Dotted hex-polygon land masses
    fetch("https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson")
      .then(r => r.json())
      .then(data => {
        if (!worldRef.current) return;
        worldRef.current
          .hexPolygonsData(data.features)
          .hexPolygonResolution(3)
          .hexPolygonMargin(0.4)
          .hexPolygonUseDots(true)
          .hexPolygonColor(() => LAND);
      })
      .catch(() => {});

    worldRef.current = world;
    setReady(true);

    const resize = () => world.width(el.clientWidth).height(el.clientHeight);
    resize();
    const ro = new ResizeObserver(resize);
    ro.observe(el);

    return () => {
      ro.disconnect();
      if (el) el.innerHTML = "";
      worldRef.current = null;
    };
  }, [globeReady]);

  // React to active city changes
  useEffect(() => {
    const w = worldRef.current;
    if (!w || !ready) return;
    w.pointColor(d => d.city === active ? ACTIVE : DOTS);
    const c = cities.find(x => x.city === active);
    if (c) {
      w.controls().autoRotate = false;
      w.pointOfView({ lat: c.lat, lng: c.lng, altitude: 2.0 }, 800);
    } else {
      w.controls().autoRotate = true;
    }
  }, [active, ready]);

  const activeCity = cities.find(c => c.city === active);

  return (
    <div className="globe-container">
      <div ref={mountRef} className="globe-mount" />
      {activeCity && (
        <div className="globe-panel">
          <button className="globe-close" onClick={() => setActive(null)}>×</button>
          <h3>{activeCity.city}{activeCity.country ? `, ${activeCity.country}` : ""}</h3>
          {activeCity.items.map((item, i) => (
            <div key={i} className="globe-item">
              {item.type && <span className="globe-tag">{item.type}</span>}
              <div className="globe-venue">{item.venue}</div>
              <div className="globe-year">{item.year}</div>
              {(item.papers || []).map((p, j) => (
                <div key={j} className="globe-paper">{p}</div>
              ))}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("globe-root")).render(<GlobeSection />);
</script>
